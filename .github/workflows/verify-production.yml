name: Verify production portfolio

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-production
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SITE_URL: https://rufus-hsu-portfolio-ai-saas-hsu.vercel.app
    steps:
      - name: Verify public production page
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -L -sS -o site.html -w '%{http_code}' --max-time 20 "$SITE_URL")
          final_url=$(curl -L -sS -o /dev/null -w '%{url_effective}' --max-time 20 "$SITE_URL")
          test "$status" = "200"
          grep -q "Rufus Hsu" site.html
          [[ "$final_url" != *"vercel.com/login"* ]]

      - name: Verify critical assets and security headers
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "$SITE_URL/styles.css" | grep -q "styles-1.css"
          curl -fsSL "$SITE_URL/script.js" | grep -q "Rufus Hsu"
          curl -fsSI "$SITE_URL/resume-rufus-hsu.pdf" | grep -qi '^content-type: application/pdf'
          curl -fsSI "$SITE_URL" | grep -qi '^x-content-type-options: nosniff'
