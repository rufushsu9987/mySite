name: Diagnose Vercel URLs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Probe deployment URLs
        shell: bash
        run: |
          set +e
          : > diagnostics.tsv
          urls=(
            "https://rufus-hsu-portfolio-hyqxkk848-ai-saas-hsu.vercel.app"
            "https://rufus-hsu-portfolio-ai-saas-hsu.vercel.app"
            "https://rufus-hsu-portfolio-rufushsu9987-ai-saas-hsu.vercel.app"
          )
          index=0
          for url in "${urls[@]}"; do
            index=$((index + 1))
            meta=$(curl -L -sS -D "headers-${index}.txt" -o "response-${index}.html" -w '%{http_code}\t%{url_effective}\t%{content_type}\t%{size_download}' --max-time 25 "$url" || true)
            printf '%s\t%s\n' "$url" "$meta" >> diagnostics.tsv
          done
          python3 - <<'PY'
          import hashlib
          import json
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          rows = []
          with open('diagnostics.tsv', encoding='utf-8') as handle:
              for index, line in enumerate(handle, start=1):
                  fields = line.rstrip('\n').split('\t')
                  while len(fields) < 5:
                      fields.append('')
                  url, status, final_url, content_type, size = fields[:5]
                  body_path = Path(f'response-{index}.html')
                  raw = body_path.read_bytes() if body_path.exists() else b''
                  text = raw.decode('utf-8', errors='replace')
                  title_match = re.search(r'<title[^>]*>(.*?)</title>', text, re.I | re.S)
                  title = re.sub(r'\s+', ' ', title_match.group(1)).strip() if title_match else ''
                  preview = re.sub(r'\s+', ' ', text).strip()[:500]
                  headers_path = Path(f'headers-{index}.txt')
                  headers = headers_path.read_text(encoding='utf-8', errors='replace') if headers_path.exists() else ''
                  rows.append({
                      'url': url,
                      'http_status': status or 'unavailable',
                      'final_url': final_url,
                      'content_type': content_type,
                      'size_download': size,
                      'contains_rufus_hsu': 'Rufus Hsu' in text,
                      'title': title,
                      'body_preview': preview,
                      'sha256': hashlib.sha256(raw).hexdigest(),
                      'has_vercel_auth_cookie': '_vercel_jwt' in headers.lower(),
                  })
          with open('deployment-status.json', 'w', encoding='utf-8') as handle:
              json.dump({
                  'checked_at': datetime.now(timezone.utc).isoformat(),
                  'results': rows,
              }, handle, ensure_ascii=False, indent=2)
              handle.write('\n')
          PY

      - name: Persist diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment-status.json
          if git diff --cached --quiet; then
            echo "No diagnostic changes to commit."
          else
            git commit -m "ci: record Vercel probe [skip ci]"
            git push
          fi
